name: Secure API CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  security-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install -r lab1/requirements.txt
      - name: SAST (Bandit)
        run: bandit -r lab1 -x lab1/tests -f txt
      - name: SCA (pip-audit)
        run: pip install pip-audit && pip-audit -r lab1/requirements.txt
